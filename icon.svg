<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#0d2b2b"/>

  <!-- background circuit lines -->
  <g stroke="#1c4a45" stroke-width="1">
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
  </g>

  <!-- USB wire jammed into the back of the android -->
  <g stroke="#8a8f98" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 150 60 C 175 50, 185 65, 178 85 C 172 102, 150 95, 148 78"/>
  </g>
  <!-- wire connector plug at the back -->
  <rect x="140" y="68" width="16" height="10" rx="2" fill="#c9ccd1"/>
  <!-- entry point into the shell (small dark socket) -->
  <circle cx="139" cy="73" r="4" fill="#050d0d"/>

  <!-- android body -->
  <g transform="translate(100,110)">
    <!-- antennae -->
    <line x1="-24" y1="-52" x2="-34" y2="-68" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="-52" x2="34" y2="-68" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/>

    <!-- head/dome -->
    <path d="M -40 -18 A 40 40 0 0 1 40 -18 Z" fill="#3ddc97"/>
    <!-- eyes -->
    <circle cx="-16" cy="-26" r="3.5" fill="#0d2b2b"/>
    <circle cx="16" cy="-26" r="3.5" fill="#0d2b2b"/>

    <!-- body -->
    <rect x="-40" y="-18" width="80" height="55" fill="#3ddc97"/>

    <!-- arms -->
    <rect x="-52" y="-14" width="12" height="40" rx="6" fill="#3ddc97"/>
    <rect x="40" y="-14" width="12" height="40" rx="6" fill="#3ddc97"/>

    <!-- legs -->
    <rect x="-28" y="37" width="12" height="24" rx="6" fill="#3ddc97"/>
    <rect x="16" y="37" width="12" height="24" rx="6" fill="#3ddc97"/>

    <!-- thermometer in mouth -->
    <g transform="translate(0,-4)">
      <rect x="-4" y="-2" width="8" height="26" rx="4" fill="#e8fff6" stroke="#0d2b2b" stroke-width="1"/>
      <circle cx="0" cy="24" r="6" fill="#ff5c5c"/>
      <rect x="-2.5" y="2" width="5" height="18" fill="#ff5c5c"/>
    </g>
  </g>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="none" stroke="#0a1f1f" stroke-width="2"/>
</svg>