name: Release

on:
  workflow_dispatch:

env:
  API_LEVEL: 21
  NDK_VERSION: "27.2.12479018"
  ROBOLECTRIC_JAR_URL: "https://repo1.maven.org/maven2/org/robolectric/android-all/17-robolectric-15733970/android-all-17-robolectric-15733970.jar"

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.extract.outputs.version_name }}
      version_code: ${{ steps.extract.outputs.version_code }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract versionName/versionCode from build.gradle.kts
        id: extract
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$FILE")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Extracted versionName=$VERSION_NAME versionCode=$VERSION_CODE"

  build:
    needs: extract-version
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify NDK toolchain
        run: |
          echo "NDK Home: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"

      - name: Compile dxls.c for all 4 architectures
        run: |
          set -euo pipefail

          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          SRC="src_ext/dxls.c"
          OUT_DIR="app/src/main/assets/dxls"
          mkdir -p "$OUT_DIR"

          ARCHES=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          CLANGS=(
            "aarch64-linux-android${API_LEVEL}-clang"
            "armv7a-linux-androideabi${API_LEVEL}-clang"
            "i686-linux-android${API_LEVEL}-clang"
            "x86_64-linux-android${API_LEVEL}-clang"
          )

          for i in "${!ARCHES[@]}"; do
            ARCH="${ARCHES[$i]}"
            CLANG="${CLANGS[$i]}"
            echo "Building for $ARCH using $CLANG"
            "$NDK_TOOLCHAIN/$CLANG" \
              -O2 -fPIE -pie \
              -o "dxls-${ARCH}" \
              "$SRC"
            cp "dxls-${ARCH}" "$OUT_DIR/dxls-${ARCH}"
          done

          echo "Built binaries:"
          ls -la "$OUT_DIR"

      - name: Download Robolectric android-all jar (compile-time Android stubs)
        run: |
          mkdir -p .tools
          curl -L -o .tools/android-all-17-robolectric-15733970.jar "$ROBOLECTRIC_JAR_URL"

      - name: Compile PkgDump.java to class file
        run: |
          mkdir -p .build/classes
          javac \
            -cp .tools/android-all-17-robolectric-15733970.jar \
            -d .build/classes \
            src_ext/PkgDump.java

      - name: Convert classes to dex using d8
        env:
          SKIP_JDK_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          D8="$ANDROID_SDK_ROOT/build-tools"/*/d8
          D8_BIN=$(ls $D8 | tail -n1)
          echo "Using d8: $D8_BIN"

          find .build/classes -name "*.class" > .build/class-list.txt

          "$D8_BIN" \
            --output .build \
            --min-api "$API_LEVEL" \
            @.build/class-list.txt

          ls -la .build

      - name: Rename dex to pkg-dump.jar and move to assets
        run: |
          set -euo pipefail
          OUT_DIR="app/src/main/assets"
          mkdir -p "$OUT_DIR"
          cp .build/classes.dex "$OUT_DIR/pkg-dump.jar"
          ls -la "$OUT_DIR"

      - name: Decode keystore
        if: matrix.build_type == 'release'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble ${{ matrix.build_type }} APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "release" ]; then
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate and rename built APK
        id: locate
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ matrix.build_type }}"
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          SRC_APK=$(find "app/build/outputs/apk/${BUILD_TYPE}" -name "*.apk" | head -n1)
          DEST_DIR="app/build/outputs/apk/${BUILD_TYPE}"
          DEST_NAME="Dioxamine-v${VERSION_NAME}-${BUILD_TYPE}.apk"
          cp "$SRC_APK" "$DEST_DIR/$DEST_NAME"
          echo "apk_path=$DEST_DIR/$DEST_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$DEST_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.build_type }}-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Upload native binaries + pkg-dump.jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxls-native-and-pkgdump-${{ matrix.build_type }}
          path: |
            app/src/main/assets/dxls/*
            app/src/main/assets/pkg-dump.jar

  release:
    needs: [extract-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-apk

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: debug-apk

      - name: Create and push tag
        env:
          VERSION_NAME: ${{ needs.extract-version.outputs.version_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Dioxamine v${{ needs.extract-version.outputs.version_name }}"
          files: |
            release-apk/*.apk
            debug-apk/*.apk
