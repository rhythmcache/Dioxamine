name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA (or tag) to checkout and build'
        required: true
        default: ''

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.extract.outputs.version_name }}
      version_code: ${{ steps.extract.outputs.version_code }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Extract version
        id: extract
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$FILE")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE")

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  build:
    needs: extract-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: locate
        run: |
          set -euo pipefail

          VERSION="${{ needs.extract-version.outputs.version_name }}"

          SRC=$(find "app/build/outputs/apk/release" -name "*.apk" | head -n1)

          DEST="app/build/outputs/apk/release/Dioxamine-v${VERSION}-release.apk"

          cp "$SRC" "$DEST"

          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets-release
          path: |
            app/src/main/assets/dxls/*
            app/src/main/assets/diox-agent.jar
            app/src/main/assets/scrcpy-server.jar

  release:
    needs:
      - extract-version
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-apk

      - name: Create and push tag
        env:
          VERSION: ${{ needs.extract-version.outputs.version_name }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$TAG"
          git push -f origin "$TAG"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Read changelog for version code
        id: changelog
        env:
          VERSION_CODE: ${{ needs.extract-version.outputs.version_code }}
        run: |
          set -euo pipefail

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          {
            echo "body<<CHANGELOG_EOF"
            if [ -f "$CHANGELOG_FILE" ]; then
              cat "$CHANGELOG_FILE"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Dioxamine v${{ needs.extract-version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            release-apk/*.apk
