name: CI Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install SDK components and NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: matrix.variant == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.variant }} APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          VARIANT="${{ matrix.variant }}"
          TASK="assemble${VARIANT^}"
          ./gradlew "$TASK" --no-daemon

      - name: Rename APK with commit SHA
        id: locate
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          SRC=$(find "app/build/outputs/apk/${VARIANT}" -name "*.apk" | head -n1)
          DEST="app/build/outputs/apk/${VARIANT}/Dioxamine-${SHORT_SHA}-${VARIANT}.apk"

          cp "$SRC" "$DEST"

          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.variant }}-apk-${{ steps.sha.outputs.short_sha }}
          path: ${{ steps.locate.outputs.apk_path }}
